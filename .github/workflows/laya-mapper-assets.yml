name: Laya-mapper Windows assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub release tag for the reviewed Laya assets
        required: true
        default: laya-mapper-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
      - name: Install pinned CPU builder inputs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/NandhaKishorM/laya/releases/download/v0.3.5/laya-0.3.5-py3-none-any.whl#sha256=4c57f64cbaf893bb5c7b4affddc2bf21a819f55df51941689f11868583be2903"
          python -m pip install --disable-pip-version-check "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.6" "safetensors==0.6.2" "huggingface_hub==0.35.3" "numpy==2.3.4" "pyinstaller==6.16.0"
      - name: Download the pinned multilingual checkpoint for asset publication
        shell: pwsh
        run: |
          @'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="convaiinnovations/laya",
              revision="1c5edc17a7acd8701df6fc341c0d179f1c62c982",
              allow_patterns=["multilingual/**"],
              local_dir="laya-source",
          )
          '@ | python -
      - name: Build and smoke-test app-local CPU runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\laya-build-assets | Out-Null
          python -m PyInstaller --noconfirm --clean --onedir --name laya-mapper --collect-all laya --collect-all safetensors --hidden-import transformers.models.modernbert.configuration_modernbert --hidden-import transformers.models.modernbert.modeling_modernbert .\laya-mapper\runner.py
          $runtimeSmoke = '{"id":"smoke","action":"status","input":{}}' | .\dist\laya-mapper\laya-mapper.exe serve
          if (($runtimeSmoke -join "`n") -notmatch '"id":"smoke"') { throw "The packaged Laya runtime status request failed." }
          tar.exe -czf .\laya-build-assets\laya-mapper-runtime-cpu-x64.tar.gz -C .\dist\laya-mapper .
          Remove-Item -Recurse -Force .\build, .\dist
          python -m PyInstaller --noconfirm --clean --onedir --name laya-trainer --collect-all laya --collect-all safetensors --hidden-import transformers.models.modernbert.configuration_modernbert --hidden-import transformers.models.modernbert.modeling_modernbert .\laya-mapper\trainer.py
          $trainerHelp = .\dist\laya-trainer\laya-trainer.exe --help
          if ($LASTEXITCODE -ne 0 -or ($trainerHelp -join "`n") -notmatch 'train') { throw "The packaged CPU Laya trainer did not start." }
          tar.exe -czf .\laya-build-assets\laya-trainer-cpu-x64.tar.gz -C .\dist\laya-trainer .
          python -m pip freeze | Set-Content -Encoding utf8 .\laya-build-assets\cpu-build-requirements.txt
      - name: Build and smoke-test the app-local CUDA trainer
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .\build, .\dist
          python -m pip install --disable-pip-version-check --force-reinstall "torch==2.9.1" --index-url https://download.pytorch.org/whl/cu128
          python -m PyInstaller --noconfirm --clean --onedir --name laya-trainer --collect-all laya --collect-all safetensors --hidden-import transformers.models.modernbert.configuration_modernbert --hidden-import transformers.models.modernbert.modeling_modernbert .\laya-mapper\trainer.py
          $trainerHelp = .\dist\laya-trainer\laya-trainer.exe --help
          if ($LASTEXITCODE -ne 0 -or ($trainerHelp -join "`n") -notmatch 'train') { throw "The packaged CUDA Laya trainer did not start." }
          tar.exe -czf .\laya-build-assets\laya-trainer-cuda-x64.tar.gz -C .\dist\laya-trainer .
          python -m pip freeze | Set-Content -Encoding utf8 .\laya-build-assets\cuda-build-requirements.txt
      - name: Exercise real checkpoint loading in the packaged CPU runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\smoke\runtime | Out-Null
          New-Item -ItemType Directory -Force '.\smoke\local\XSOAR Incident Assistant\laya-mapper\models\base-multilingual' | Out-Null
          tar.exe -xzf .\laya-build-assets\laya-mapper-runtime-cpu-x64.tar.gz -C .\smoke\runtime
          Copy-Item -Recurse -Force .\laya-source\multilingual\* '.\smoke\local\XSOAR Incident Assistant\laya-mapper\models\base-multilingual'
          $env:LOCALAPPDATA = (Resolve-Path .\smoke\local).Path
          @(
            '{"id":"load","action":"useCheckpoint","input":{"checkpointId":"base-multilingual"}}',
            '{"id":"tokens","action":"countTokens","input":{"leaves":[{"pointer":"/documents/0/opaque","value":"203.0.113.8"}]}}'
          ) | .\smoke\runtime\laya-mapper.exe serve | Tee-Object -Variable responses | Out-Null
          if (($responses -join "`n") -notmatch '"id":"load".*"checkpointId":"base-multilingual"') { throw "The packaged Laya runtime did not load the pinned checkpoint." }
          if (($responses -join "`n") -notmatch '"id":"tokens".*"result":') { throw "The packaged Laya runtime did not execute a tokenizer request." }
      - name: Create fixed-size SHA-256 release manifest
        shell: pwsh
        run: node .\scripts\create-laya-release-manifest.mjs .\laya-build-assets\laya-mapper-runtime-cpu-x64.tar.gz .\laya-build-assets\laya-trainer-cpu-x64.tar.gz .\laya-build-assets\laya-trainer-cuda-x64.tar.gz .\laya-source\multilingual .\laya-assets $env:GITHUB_REPOSITORY ${{ inputs.release_tag }}
      - name: Include reproducible build inventories
        shell: pwsh
        run: Copy-Item .\laya-build-assets\*-build-requirements.txt .\laya-assets
      - name: Enforce GitHub Release asset size limits
        shell: pwsh
        run: |
          $oversized = Get-ChildItem .\laya-assets -File | Where-Object Length -ge 2GB
          if ($oversized) { throw "Laya assets exceed GitHub's per-file release limit: $($oversized.Name -join ', ')" }
      - name: Publish versioned candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ inputs.release_tag }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ inputs.release_tag }}" --prerelease --title "Laya-mapper Windows assets" --notes "Offline Laya 0.3.5 runtimes and pinned laya-multilingual checkpoint. Review the manifest before application release use." }
          gh release upload "${{ inputs.release_tag }}" .\laya-assets\*
