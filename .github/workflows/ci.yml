name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: xsoar-incident-assistant-extension
          path: output/xsoar-incident-assistant-extension.zip
