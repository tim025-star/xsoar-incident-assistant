name: Laya developer-only training runtimes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
      - name: Build head-only-capable CPU developer trainer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/NandhaKishorM/laya/releases/download/v0.3.5/laya-0.3.5-py3-none-any.whl#sha256=4c57f64cbaf893bb5c7b4affddc2bf21a819f55df51941689f11868583be2903"
          python -m pip install --disable-pip-version-check "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.6" "safetensors==0.6.2" "numpy==2.3.4" "pyinstaller==6.16.0"
          Push-Location .\trainer\python
          python -m unittest test_compiler.py test_developer_trainer.py
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'Developer trainer tests failed.' }
          Pop-Location
          python -m PyInstaller --noconfirm --clean --onedir --name laya-developer-trainer --collect-all laya --collect-all safetensors --add-data ".\trainer\python\base-model-manifest.json;." .\trainer\python\developer_trainer.py
          if ($LASTEXITCODE -ne 0) { throw 'CPU developer trainer packaging failed.' }
          .\dist\laya-developer-trainer\laya-developer-trainer.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CPU trainer help smoke failed.' }
          $status = .\dist\laya-developer-trainer\laya-developer-trainer.exe runtime-status --device cpu | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CPU trainer status smoke failed.' }
          if ($status.laya -ne '0.3.5' -or $status.transformers -ne '4.57.6' -or $status.safetensors -ne '0.6.2' -or $status.cuda) { throw 'Packaged CPU trainer identity check failed.' }
          python -c "import torch; assert torch.version.cuda is None"
          if ($LASTEXITCODE -ne 0) { throw 'CPU-only Torch verification failed.' }
          tar.exe -czf .\laya-developer-trainer-cpu-x64.tar.gz -C .\dist\laya-developer-trainer .
          if ($LASTEXITCODE -ne 0) { throw 'CPU trainer archive creation failed.' }
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $env:TRAINER_RUNTIME_DIRECTORY = "$env:GITHUB_WORKSPACE\dist\laya-developer-trainer"
          $env:TRAINER_BACKEND = "cpu"
          npm run package:laya-trainer:windows
          if ($LASTEXITCODE -ne 0) { throw 'CPU trainer installer packaging failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laya-developer-trainer-cpu-x64
          path: |
            laya-developer-trainer-cpu-x64.tar.gz
            artifacts/trainer/XSOAR-Laya-Trainer-Setup-*-cpu-x64.exe
            artifacts/trainer/XSOAR-Laya-Trainer-Setup-*-cpu-x64.exe.sha256
          retention-days: 7

  cuda:
    runs-on: [self-hosted, Windows, X64, NVIDIA]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
      - name: Build and exercise CUDA developer trainer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/NandhaKishorM/laya/releases/download/v0.3.5/laya-0.3.5-py3-none-any.whl#sha256=4c57f64cbaf893bb5c7b4affddc2bf21a819f55df51941689f11868583be2903"
          python -m pip install --disable-pip-version-check "torch==2.9.1" --index-url https://download.pytorch.org/whl/cu128
          python -m pip install --disable-pip-version-check "transformers==4.57.6" "safetensors==0.6.2" "numpy==2.3.4" "pyinstaller==6.16.0"
          Push-Location .\trainer\python
          python -m unittest test_compiler.py test_developer_trainer.py
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'Developer trainer tests failed.' }
          Pop-Location
          python -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.get_device_capability()[0] >= 7; m=torch.nn.Linear(8,2,device='cuda'); o=torch.optim.AdamW(m.parameters()); loss=m(torch.ones((2,8),device='cuda')).sum(); loss.backward(); o.step(); torch.cuda.synchronize(); print(torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA training smoke failed.' }
          python -m PyInstaller --noconfirm --clean --onedir --name laya-developer-trainer --collect-all laya --collect-all safetensors --add-data ".\trainer\python\base-model-manifest.json;." .\trainer\python\developer_trainer.py
          if ($LASTEXITCODE -ne 0) { throw 'CUDA developer trainer packaging failed.' }
          .\dist\laya-developer-trainer\laya-developer-trainer.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CUDA trainer help smoke failed.' }
          $status = .\dist\laya-developer-trainer\laya-developer-trainer.exe runtime-status --device cuda | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CUDA trainer status smoke failed.' }
          if ($status.laya -ne '0.3.5' -or $status.transformers -ne '4.57.6' -or $status.safetensors -ne '0.6.2' -or -not $status.cuda -or $status.cudaDevices.Count -lt 1) { throw 'Packaged CUDA trainer identity check failed.' }
          tar.exe -czf .\laya-developer-trainer-cuda-x64.tar.gz -C .\dist\laya-developer-trainer .
          if ($LASTEXITCODE -ne 0) { throw 'CUDA trainer archive creation failed.' }
          $machineInno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $userInno = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $machineInno) -and -not (Test-Path -LiteralPath $userInno)) {
            winget install --id JRSoftware.InnoSetup --exact --scope user --accept-source-agreements --accept-package-agreements --silent
            if ($LASTEXITCODE -ne 0) { throw 'Per-user Inno Setup installation failed.' }
          }
          $env:ISCC_PATH = if (Test-Path -LiteralPath $machineInno) { $machineInno } else { $userInno }
          $env:TRAINER_RUNTIME_DIRECTORY = "$env:GITHUB_WORKSPACE\dist\laya-developer-trainer"
          $env:TRAINER_BACKEND = "cuda"
          npm run package:laya-trainer:windows
          if ($LASTEXITCODE -ne 0) { throw 'CUDA trainer installer packaging failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laya-developer-trainer-cuda-x64
          path: |
            laya-developer-trainer-cuda-x64.tar.gz
            artifacts/trainer/XSOAR-Laya-Trainer-Setup-*-cuda-x64.exe
            artifacts/trainer/XSOAR-Laya-Trainer-Setup-*-cuda-x64.exe.sha256
          retention-days: 7
