name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:browser
      - run: npm audit --audit-level=high
      - name: Verify that the tag matches package.json
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "The release tag must be v$version." }
      - name: Verify that the release tag is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The release tag must reference a commit reachable from origin/main." }
      - name: Download the pinned Node.js runtime
        shell: pwsh
        run: .\installer\download-node-runtime.ps1 -Destination .\installer\runtime\node.exe
      - name: Download and verify the reviewed Laya asset manifest
        shell: pwsh
        env:
          LAYA_MAPPER_MANIFEST_URL: ${{ vars.LAYA_MAPPER_MANIFEST_URL }}
          LAYA_MAPPER_MANIFEST_SHA256: ${{ vars.LAYA_MAPPER_MANIFEST_SHA256 }}
        run: |
          if (-not $env:LAYA_MAPPER_MANIFEST_URL -or -not $env:LAYA_MAPPER_MANIFEST_SHA256) { throw "Set the reviewed Laya manifest URL and SHA-256 repository variables." }
          Invoke-WebRequest -Uri $env:LAYA_MAPPER_MANIFEST_URL -OutFile .\installer\laya-mapper-manifest.json
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath .\installer\laya-mapper-manifest.json).Hash.ToLowerInvariant()
          if ($actual -ne $env:LAYA_MAPPER_MANIFEST_SHA256.ToLowerInvariant()) { throw "The reviewed Laya manifest SHA-256 does not match." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
      - name: Build the installer
        env:
          NODE_RUNTIME_PATH: ${{ github.workspace }}\installer\runtime\node.exe
          LAYA_MAPPER_MANIFEST_PATH: ${{ github.workspace }}\installer\laya-mapper-manifest.json
          APP_VERSION: ${{ github.ref_name }}
        run: npm run package:windows
      - name: Write installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Installer output was not found." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $installer.DirectoryName "$($installer.Name).sha256") -Value "$hash *$($installer.Name)" -NoNewline
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME .\artifacts\*.exe .\artifacts\*.sha256 --generate-notes --verify-tag --notes "Laya incident mapping is opt-in and uses the reviewed demo checkpoint. Analysts must review mapped fields before copying the response. This installer is unsigned. Verify its SHA-256 checksum before running it; Windows may show an unknown-publisher warning."
